# Weekly: run DE/KDE/tools/kde-bump and open (or refresh) one pull request
# with the result. Uses the workflow's own GITHUB_TOKEN and the REST API, no
# gh CLI. kde-bump also fills an empty checksum in any hand-written template
# anywhere in the repo (Utilities/kitty and so on).
#
# On every push and pull request that touches DE/KDE, the check job runs
# kde-gen --check, so a hand edit to a generated template is caught.
#
# One repository setting is needed for the token to open pull requests:
# Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".
name: kde-bump

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  push:
    paths: ["DE/KDE/**"]
  pull_request:
    paths: ["DE/KDE/**"]

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generated templates match DE/KDE/manifest
        run: sh DE/KDE/tools/kde-gen --check

  bump:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # one bump at a time; a second one waits instead of racing on the branch
    concurrency:
      group: kde-bump
      cancel-in-progress: false
    env:
      BRANCH: kde-bump
    steps:
      - uses: actions/checkout@v4

      - name: Install b3sum
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq b3sum || cargo install --locked b3sum
          b3sum --version

      - name: Run kde-bump
        run: |
          rc=0
          sh DE/KDE/tools/kde-bump --report "$RUNNER_TEMP/report.md" || rc=$?
          echo "BUMP_RC=$rc" >>"$GITHUB_ENV"
          # 1 means some downloads failed; what did work is still worth a PR
          [ "$rc" -le 1 ]

      - name: Commit to the kde-bump branch
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            echo "changed=no" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "kde: bump versions and checksums ($(date -u +%Y-%m-%d))"
          git push -f origin "$BRANCH"
          echo "changed=yes" >>"$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # api METHOD PATH [curl args]: prints the body, or GitHub's error and fails
          api() {
            resp=$(curl -sS -X "$1" -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" -w '\n%{http_code}' \
              "https://api.github.com/repos/$REPO$2" "${@:3}")
            code=${resp##*$'\n'}
            body=${resp%$'\n'*}
            if [ "$code" -ge 300 ]; then
              echo "GitHub API: $1 $2 returned HTTP $code" >&2
              printf '%s\n' "$body" >&2
              case $body in *"not permitted to create or approve pull requests"*)
                echo "Turn on Settings > Actions > General > Workflow permissions >" >&2
                echo "\"Allow GitHub Actions to create and approve pull requests\", then rerun." >&2 ;;
              esac
              return 1
            fi
            printf '%s\n' "$body"
          }
          {
            echo "Weekly run of DE/KDE/tools/kde-bump."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Before merging: a minor release (Plasma 6.x to 6.y, Qt 6.x to 6.y) can need"
            echo "new dependencies or refreshed patches in DE/KDE/patches/. A build on a Basix"
            echo "box is the real test."
          } >"$RUNNER_TEMP/body.md"
          title="kde: version and checksum bump ($(date -u +%Y-%m-%d))"
          owner=${REPO%%/*}
          num=$(api GET "/pulls?state=open&head=$owner:$BRANCH" | jq -r '.[0].number // empty')
          if [ -n "$num" ]; then
            jq -n --arg t "$title" --rawfile b "$RUNNER_TEMP/body.md" '{title: $t, body: $b}' |
              api PATCH "/pulls/$num" -d @- >/dev/null
            echo "Updated pull request #$num."
          else
            jq -n --arg t "$title" --rawfile b "$RUNNER_TEMP/body.md" --arg h "$BRANCH" --arg base "$BASE" \
              '{title: $t, body: $b, head: $h, base: $base}' |
              api POST "/pulls" -d @- | jq -r '"Opened pull request #\(.number)."'
          fi
