# Weekly: run Packaging/pkg-bump, which moves every hand-written template that
# has a `watch` file next to it to its newest upstream release, writes the
# BLAKE3 checksums and resets revision=1. Opens one pull request with the
# result (or refreshes the open one). Templates generated by kde-gen are left
# to the kde-bump workflow.
#
# A pull request opened with the workflow's own token doesn't trigger other
# workflows, so the lint result for the bumped packages is in the pull
# request body instead of a check.
#
# Uses the workflow's own GITHUB_TOKEN and the REST API, no gh CLI. Needs the
# same setting kde-bump does: Settings > Actions > General > Workflow
# permissions > "Allow GitHub Actions to create and approve pull requests".
name: pkg-bump

on:
  schedule:
    - cron: "41 5 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    concurrency:
      group: pkg-bump
      cancel-in-progress: false
    env:
      BRANCH: pkg-bump
    steps:
      - uses: actions/checkout@v5

      - name: Install b3sum
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq b3sum || cargo install --locked b3sum
          b3sum --version

      - name: Run pkg-bump
        run: |
          rc=0
          bash Packaging/pkg-bump --report "$RUNNER_TEMP/report.md" || rc=$?
          echo "BUMP_RC=$rc" >>"$GITHUB_ENV"
          # 1 means some packages failed; what did work is still worth a PR
          [ "$rc" -le 1 ]

      - name: Commit to the pkg-bump branch
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing changed."
            echo "changed=no" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -A
          git commit -q -m "pkg-bump: versions and checksums ($(date -u +%Y-%m-%d))"
          git push -f origin "$BRANCH"
          echo "changed=yes" >>"$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # api METHOD PATH [curl args]: prints the body, or GitHub's error and fails
          api() {
            resp=$(curl -sS -X "$1" -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" -w '\n%{http_code}' \
              "https://api.github.com/repos/$REPO$2" "${@:3}")
            code=${resp##*$'\n'}
            body=${resp%$'\n'*}
            if [ "$code" -ge 300 ]; then
              echo "GitHub API: $1 $2 returned HTTP $code" >&2
              printf '%s\n' "$body" >&2
              case $body in *"not permitted to create or approve pull requests"*)
                echo "Turn on Settings > Actions > General > Workflow permissions >" >&2
                echo "\"Allow GitHub Actions to create and approve pull requests\", then rerun." >&2 ;;
              esac
              return 1
            fi
            printf '%s\n' "$body"
          }
          {
            echo "Weekly run of Packaging/pkg-bump."
            echo
            cat "$RUNNER_TEMP/report.md"
            echo
            echo "Before merging: a new upstream version can need new dependencies, new"
            echo "configure options or refreshed patches. \"unchecked\" means the checksum is"
            echo "whatever the download was, compare against a signed release if that matters."
            echo "A build on a Basix box is the real test."
          } >"$RUNNER_TEMP/body.md"
          title="pkg-bump: version and checksum bump ($(date -u +%Y-%m-%d))"
          owner=${REPO%%/*}
          num=$(api GET "/pulls?state=open&head=$owner:$BRANCH" | jq -r '.[0].number // empty')
          if [ -n "$num" ]; then
            jq -n --arg t "$title" --rawfile b "$RUNNER_TEMP/body.md" '{title: $t, body: $b}' |
              api PATCH "/pulls/$num" -d @- >/dev/null
            echo "Updated pull request #$num."
          else
            jq -n --arg t "$title" --rawfile b "$RUNNER_TEMP/body.md" --arg h "$BRANCH" --arg base "$BASE" \
              '{title: $t, body: $b, head: $h, base: $base}' |
              api POST "/pulls" -d @- | jq -r '"Opened pull request #\(.number)."'
          fi
